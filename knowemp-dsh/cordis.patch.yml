# Load the KnowEmp Q&A preset into the web profile and hide coding-agent chrome.
# Launch from the deepseek-harness repo root:
#   pnpm dsh web --patch ./knowemp-dsh/cordis.patch.yml
#
# Chrome rows stay off unless DEV_CHROME=1 in the loaded `.env` (not `.env.dev`).
# `disabled` on a dsh.client row drops it from window.__DSH_BOOT__.
# Do not disable ui-sidebar-right: ui-chat injects `sidebarRight` and will not mount without it.
# Do not disable ui-commands unless you also disable every plugin that injects `commandUi`
# (ui-model-selection, ui-permission).

- id: agent-presets
  config:
    default: knowemp
    includeShippedRoot: !!js process.env.DEV_CHROME === '1'
    includeUserRoot: !!js process.env.DEV_CHROME === '1'
    roots:
      - path: !!js process.env.KNOWEMP_DSH_PRESETS || process.getBuiltinModule('node:path').join(process.cwd(), 'knowemp-dsh/presets')
        trust: system

- insert:
    - id: knowemp-workspace
      name: './ensure-workspace.ts'

# ── roster / IDE chrome the Q&A users should not see ────────────────────────

- id: ui-agent-preset
